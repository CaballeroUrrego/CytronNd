<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuarios Registrados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4" style="max-width: 600px;">
    <h2 class="text-center">Registro de Usuario</h2>

    <form id="formRegistro" class="mb-4">
      <input type="text" id="usuario" class="form-control mb-2" placeholder="Usuario" required>
      <input type="password" id="contrasena" class="form-control mb-2" placeholder="Contraseña" required>
      <button class="btn btn-primary w-100" type="submit">Registrar</button>
    </form>

    <h3 class="text-center">Usuarios registrados</h3>
    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Usuario</th>
        </tr>
      </thead>
      <tbody id="tablaUsuarios"></tbody>
    </table>

    <p id="mensaje" class="text-center text-danger"></p>
  </div>

  <script>
    const mensaje = document.getElementById('mensaje');

    document.getElementById('formRegistro').addEventListener('submit', async function (e) {
      e.preventDefault();
      mensaje.innerText = '';
      const usuario = document.getElementById('usuario').value.trim();
      const contrasena = document.getElementById('contrasena').value;

      try {
        const res = await fetch('/api/usuarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, contrasena })
        });
        const data = await res.json();

        if (res.ok) {
          alert(data.mensaje || 'Usuario registrado');
          this.reset();
          cargarUsuarios();
        } else {
          mensaje.innerText = data.mensaje || '❌ Error al registrar';
        }
      } catch (err) {
        console.error(err);
        mensaje.innerText = '❌ Error de red';
      }
    });

    async function cargarUsuarios() {
      try {
        const res = await fetch('/api/usuarios');
        const usuarios = await res.json();

        const tabla = document.getElementById('tablaUsuarios');
        tabla.innerHTML = '';

        usuarios.forEach(u => {
          const fila = `<tr><td>${u.id}</td><td>${u.usuario}</td></tr>`;
          tabla.innerHTML += fila;
        });
      } catch (err) {
        console.error(err);
        mensaje.innerText = '❌ Error al cargar usuarios';
      }
    }

    cargarUsuarios();
  </script>
</body>
</html>
